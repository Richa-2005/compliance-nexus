services:
  - type: web
    name: compliancenexus-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: GROQ
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: JWT_ALGORITHM
        value: HS256
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
