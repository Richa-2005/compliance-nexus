<svg width="1180" height="360" viewBox="0 0 1180 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ComplianceNexus RAG and verdict pipeline</title>
  <desc id="desc">A concise animated diagram of retrieval, graph traversal, extraction, deterministic checks, rationale generation, and citation validation.</desc>
  <style>
    .bg { fill: #10100f; }
    .card { fill: rgba(20,20,18,.96); stroke: rgba(244,241,234,.11); stroke-width: 1.2; }
    .card-a { stroke: rgba(215,168,75,.42); }
    .card-b { stroke: rgba(78,156,255,.34); }
    .card-c { stroke: rgba(55,178,108,.34); }
    .title { fill: #f4f1ea; font: 850 18px Inter, ui-sans-serif, system-ui, sans-serif; }
    .text { fill: #cfc7ba; font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; }
    .num { fill: #d7a84b; font: 900 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
    .line { stroke: #d7a84b; stroke-width: 2.5; stroke-dasharray: 8 9; animation: move 6s linear infinite; }
    .line-b { stroke: #4e9cff; }
    @keyframes move { to { stroke-dashoffset: -90; } }
  </style>
  <rect class="bg" width="1180" height="360" rx="18"/>
  <text x="42" y="48" class="num">PIPELINE</text>
  <text x="42" y="78" class="title" font-size="24">From unstructured query to defensible audit report</text>

  <path class="line" d="M190 190H310"/>
  <path class="line line-b" d="M450 190H570"/>
  <path class="line" d="M710 190H830"/>
  <path class="line line-b" d="M970 190H1080"/>

  <g transform="translate(42 130)">
    <rect class="card card-a" width="170" height="120" rx="12"/>
    <text x="18" y="30" class="num">01</text>
    <text x="18" y="61" class="title">Retrieve</text>
    <text x="18" y="86" class="text">Policy PDF chunks</text>
    <text x="18" y="106" class="text">and source pages</text>
  </g>
  <g transform="translate(312 130)">
    <rect class="card card-b" width="170" height="120" rx="12"/>
    <text x="18" y="30" class="num">02</text>
    <text x="18" y="61" class="title">Traverse</text>
    <text x="18" y="86" class="text">NetworkX entity</text>
    <text x="18" y="106" class="text">and policy lineage</text>
  </g>
  <g transform="translate(582 130)">
    <rect class="card card-a" width="170" height="120" rx="12"/>
    <text x="18" y="30" class="num">03</text>
    <text x="18" y="61" class="title">Extract</text>
    <text x="18" y="86" class="text">Transaction metrics</text>
    <text x="18" y="106" class="text">with structured output</text>
  </g>
  <g transform="translate(852 130)">
    <rect class="card card-c" width="170" height="120" rx="12"/>
    <text x="18" y="30" class="num">04</text>
    <text x="18" y="61" class="title">Decide</text>
    <text x="18" y="86" class="text">Deterministic checks</text>
    <text x="18" y="106" class="text">drive final status</text>
  </g>
  <g transform="translate(1018 280)">
    <text x="-700" y="0" class="text">Rationale and citations are generated after the deterministic verdict is known.</text>
  </g>
</svg>
